name: Deploy API

on:
  push:
    branches:
      - master
      - askamuslim/prod
      - port/prod

jobs:

  deploy-askamuslim:
    name: Deploy AskAMuslim
    runs-on: ubuntu-latest

    if: |
      github.ref_name == 'master' ||
      github.ref_name == 'askamuslim/prod'

    environment:
      name: askamuslim

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$SSH_KEY" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to AskAMuslim Server
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF

            set -e

            echo "🚀 Deploying AskAMuslim..."

            cd /srv/docker/api/AskAMuslimBackend

            git fetch origin

            if [ "${{ github.ref_name }}" = "master" ]; then
              git reset --hard origin/master
            else
              git reset --hard origin/askamuslim/prod
            fi

            cd /srv/docker

            docker compose up -d --build api

            echo "⏳ Waiting for health check..."

            for i in {1..30}; do
              if docker compose ps api | grep -q "healthy"; then
                echo "✅ API healthy!"
                break
              fi

              echo "Waiting... (\$i/30)"
              sleep 2
            done

            docker compose ps

            echo "✨ AskAMuslim deployment complete!"
          EOF


  deploy-islam-port:
    name: Deploy Islam Port
    runs-on: ubuntu-latest

    if: |
      github.ref_name == 'master' ||
      github.ref_name == 'port/prod'

    environment:
      name: islam-port

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$SSH_KEY" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Islam Port Server
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF

            set -e

            echo "🚀 Deploying Islam Port..."

            cd /srv/docker/api/AskAMuslimBackend

            git fetch origin

            if [ "${{ github.ref_name }}" = "master" ]; then
              git reset --hard origin/master
            else
              git reset --hard origin/port/prod
            fi

            cd /srv/docker

            docker compose up -d --build api

            echo "⏳ Waiting for health check..."

            for i in {1..30}; do
              if docker compose ps api | grep -q "healthy"; then
                echo "✅ API healthy!"
                break
              fi

              echo "Waiting... (\$i/30)"
              sleep 2
            done

            docker compose ps

            echo "✨ Islam Port deployment complete!"
          EOF
