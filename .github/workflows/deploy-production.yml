name: Deploy APIs

on:
  push:
    branches:
      - master

      - askamuslim/prod
      - port/prod
      - noor/prod

jobs:

  deploy-askamuslim:
    name: Deploy AskAMuslim
    runs-on: ubuntu-latest

    if: |
      github.ref_name == 'master' ||
      github.ref_name == 'askamuslim/prod'

    environment:
      name: askamuslim

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$SSH_KEY" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Debug SSH Key
        run: |
          echo "🔑 Public key from private key:"
          ssh-keygen -y -f ~/.ssh/deploy_key

      - name: Deploy AskAMuslim
        run: |
          ssh \
            -v \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF

            set -e

            echo "🚀 Deploying AskAMuslim..."

            cd ${{ secrets.APP_PATH }}

            git fetch origin

            if [ "${{ github.ref_name }}" = "master" ]; then
              git reset --hard origin/master
            else
              git reset --hard origin/askamuslim/prod
            fi

            docker compose up -d --build api

            docker compose ps

            echo "✅ AskAMuslim deployed!"
          EOF



  deploy-islam-port:
    name: Deploy Islam Port
    runs-on: ubuntu-latest

    if: |
      github.ref_name == 'master' ||
      github.ref_name == 'port/prod'

    environment:
      name: islam-port

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$SSH_KEY" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Islam Port
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF

            set -e

            echo "🚀 Deploying Islam Port..."

            cd ${{ secrets.APP_PATH }}

            git fetch origin

            if [ "${{ github.ref_name }}" = "master" ]; then
              git reset --hard origin/master
            else
              git reset --hard origin/port/prod
            fi

            docker compose up -d --build api

            docker compose ps

            echo "✅ Islam Port deployed!"
          EOF



  deploy-noor-ed:
    name: Deploy Noor ED
    runs-on: ubuntu-latest

    if: |
      github.ref_name == 'master' ||
      github.ref_name == 'noor/prod'

    environment:
      name: noor-ed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$SSH_KEY" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Noor ED
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF

            set -e

            echo "🚀 Deploying Noor ED..."

            cd ${{ secrets.APP_PATH }}

            git fetch origin

            if [ "${{ github.ref_name }}" = "master" ]; then
              git reset --hard origin/master
            else
              git reset --hard origin/noor/prod
            fi

            docker compose up -d --build api

            docker compose ps

            echo "✅ Noor ED deployed!"
          EOF
